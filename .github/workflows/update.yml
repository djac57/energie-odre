name: Mise à jour et déploiement

on:
  push:
    branches: [main]
  schedule:
    - cron: "23 4 * * *"   # quotidien : export ODRÉ complet (éCO2mix consolidé, ~40 Mo)
    - cron: "41 * * * *"   # horaire : API RTE (pilotage) et prix spot — dans les fréquences recommandées par RTE
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Télécharger éCO2mix et la météo régionale (ODRÉ)
        if: github.event_name != 'schedule' || github.event.schedule == '23 4 * * *'
        run: python scripts/fetch.py data/raw

      - name: Données de pilotage RTE (data.rte-france.com)
        continue-on-error: true  # secrets absents ou API en panne : on garde les dernières données versionnées
        env:
          RTE_CLIENT_ID: ${{ secrets.RTE_CLIENT_ID }}
          RTE_CLIENT_SECRET: ${{ secrets.RTE_CLIENT_SECRET }}
        run: python scripts/fetch_rte.py data/raw

      - name: Prix spot France (Energy-Charts / SMARD, CC BY 4.0)
        continue-on-error: true
        run: python scripts/fetch_prices.py data/raw

      - name: Autres énergies (ODRÉ, GIE, ENTSOG, Eurostat, data.economie, Oil Bulletin, FMI/EIA via FRED)
        if: github.event_name != 'schedule' || github.event.schedule == '23 4 * * *'   # quotidien
        continue-on-error: true
        env:
          AGSI_KEY: ${{ secrets.AGSI_KEY }}
          FRED_KEY: ${{ secrets.FRED_KEY }}
        run: python scripts/fetch_gaz_petrole.py data/raw

      - name: Navires en approche (AISStream, instantané horaire)
        continue-on-error: true
        env:
          AISSTREAM_KEY: ${{ secrets.AISSTREAM_KEY }}
        run: |
          pip install -q websockets
          python scripts/fetch_ais.py data/raw

      - name: Rivières et nappes (Hub'Eau, Open-Meteo)
        if: github.event_name != 'schedule' || github.event.schedule == '23 4 * * *'   # quotidien : débits et niveaux journaliers
        continue-on-error: true
        run: python scripts/fetch_hubeau.py data/raw

      - name: Neige modélisée sur les massifs (Open-Meteo, ERA5)
        if: github.event_name != 'schedule' || github.event.schedule == '23 4 * * *'
        continue-on-error: true
        run: python scripts/fetch_snow.py data/raw

      - name: Prix day-ahead des voisins (Energy-Charts, CC BY 4.0)
        if: github.event_name != 'schedule' || github.event.schedule == '23 4 * * *'
        continue-on-error: true
        run: python scripts/fetch_prices_eu.py data/raw

      - name: Mix européen (Ember, CC BY 4.0)
        if: github.event_name != 'schedule' || github.event.schedule == '23 4 * * *'   # ne retélécharge que si Ember a publié (≈ mensuel)
        continue-on-error: true
        run: python scripts/fetch_ember.py data/raw

      - name: Flux physiques européens et prix des écarts (ENTSO-E, CC BY 4.0)
        continue-on-error: true  # clé absente ou API lente : on garde les données versionnées
        timeout-minutes: 15
        env:
          ENTSOE_TOKEN: ${{ secrets.ENTSOE_TOKEN }}
        run: python scripts/fetch_entsoe.py data/raw

      - name: Eau, feux & air (FIRMS, VigiEau, BDIFF, Météo des forêts, Atmo, IFN, GFW)
        continue-on-error: true  # chaque source a sa propre fraîcheur ; une source en panne garde ses données précédentes
        run: python scripts/fetch_eau_feux_air.py data/raw

      - name: Climat (Météo-France, PSMSL, WGMS, OWID)
        continue-on-error: true  # le script limite lui-même ses téléchargements selon la fraîcheur de chaque source
        run: python scripts/fetch_climat.py data/raw

      - name: Construire data.js
        if: github.event_name != 'schedule' || github.event.schedule == '23 4 * * *'  # besoin des exports ODRÉ du jour
        run: python scripts/build.py data/raw site/data.js

      - name: Construire rte.js et prices.js
        continue-on-error: true
        run: |
          python scripts/build_rte.py data/raw site/rte.js
          python scripts/build_prices.py data/raw site/prices.js

      - name: Construire hubeau.js et europe.js
        continue-on-error: true
        run: |
          python scripts/build_hubeau.py data/raw site/hubeau.js
          python scripts/build_europe.py data/raw site/europe.js

      - name: Construire entsoe.js
        continue-on-error: true
        run: python scripts/build_entsoe.py data/raw site/entsoe.js

      - name: Construire autresenergies.js
        continue-on-error: true
        run: python scripts/build_gaz_petrole.py data/raw site/autresenergies.js

      - name: Construire eaufeuxair.js
        continue-on-error: true
        run: python scripts/build_eau_feux_air.py data/raw site/eaufeuxair.js

      - name: Construire climat.js
        continue-on-error: true
        run: python scripts/build_climat.py data/raw site/climat.js

      - name: Committer les nouvelles données
        continue-on-error: true  # un échec d'envoi ne doit jamais empêcher le déploiement du site
        run: |
          if [ -z "$(git status --porcelain data site)" ]; then echo "Aucune nouvelle donnée."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data site
          git commit -m "Données mises à jour ($(date -u '+%Y-%m-%d %H:%M') UTC)"
          # Des commits ont pu arriver pendant le passage : on se resynchronise avant d'envoyer
          # (en cas de conflit sur un fichier de données, la version de ce passage, plus récente, l'emporte)
          for i in 1 2 3; do
            git pull --rebase -X theirs origin main && git push && exit 0
            echo "Envoi refusé, nouvel essai ($i)…"; sleep $((i * 10))
          done
          echo "::warning::Données non poussées après 3 essais (le site est tout de même déployé)"

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
