name: Mise à jour et déploiement

on:
  push:
    branches: [main]
  schedule:
    - cron: "23 4 * * *"   # quotidien : export ODRÉ complet (éCO2mix consolidé, ~40 Mo)
    - cron: "41 * * * *"   # horaire : API RTE (pilotage) et prix spot — dans les fréquences recommandées par RTE
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Télécharger éCO2mix et la météo régionale (ODRÉ)
        if: github.event_name != 'schedule' || github.event.schedule == '23 4 * * *'
        run: python scripts/fetch.py data/raw

      - name: Données de pilotage RTE (data.rte-france.com)
        continue-on-error: true  # secrets absents ou API en panne : on garde les dernières données versionnées
        env:
          RTE_CLIENT_ID: ${{ secrets.RTE_CLIENT_ID }}
          RTE_CLIENT_SECRET: ${{ secrets.RTE_CLIENT_SECRET }}
        run: python scripts/fetch_rte.py data/raw

      - name: Prix spot France (Energy-Charts / SMARD, CC BY 4.0)
        continue-on-error: true
        run: python scripts/fetch_prices.py data/raw

      - name: Gaz et pétrole (ODRÉ, data.economie, Oil Bulletin, EIA/FRED)
        if: github.event_name != 'schedule' || github.event.schedule == '23 4 * * *'   # quotidien ; les prix à la pompe se chargent en direct dans la page
        continue-on-error: true
        run: python scripts/fetch_gaz_petrole.py data/raw

      - name: Rivières et nappes (Hub'Eau, Open-Meteo)
        if: github.event_name != 'schedule' || github.event.schedule == '23 4 * * *'   # quotidien : débits et niveaux journaliers
        continue-on-error: true
        run: python scripts/fetch_hubeau.py data/raw

      - name: Prix day-ahead des voisins (Energy-Charts, CC BY 4.0)
        if: github.event_name != 'schedule' || github.event.schedule == '23 4 * * *'
        continue-on-error: true
        run: python scripts/fetch_prices_eu.py data/raw

      - name: Mix européen (Ember, CC BY 4.0)
        if: github.event_name != 'schedule' || github.event.schedule == '23 4 * * *'   # ne retélécharge que si Ember a publié (≈ mensuel)
        continue-on-error: true
        run: python scripts/fetch_ember.py data/raw

      - name: Construire data.js
        if: github.event_name != 'schedule' || github.event.schedule == '23 4 * * *'  # besoin des exports ODRÉ du jour
        run: python scripts/build.py data/raw site/data.js

      - name: Construire rte.js et prices.js
        continue-on-error: true
        run: |
          python scripts/build_rte.py data/raw site/rte.js
          python scripts/build_prices.py data/raw site/prices.js

      - name: Construire hubeau.js et europe.js
        continue-on-error: true
        run: |
          python scripts/build_hubeau.py data/raw site/hubeau.js
          python scripts/build_europe.py data/raw site/europe.js

      - name: Construire gazpetrole.js
        continue-on-error: true
        run: python scripts/build_gaz_petrole.py data/raw site/gazpetrole.js

      - name: Committer les nouvelles données
        run: |
          if [ -n "$(git status --porcelain data site)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data site
            git commit -m "Données mises à jour ($(date -u '+%Y-%m-%d %H:%M') UTC)"
            git push
          else
            echo "Aucune nouvelle donnée."
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: update
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
